version: '3.8'

services:
  postgres:
    container_name: nautilus-database
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nautilus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: ${POSTGRES_DATABASE:-nautilus}
      PGDATA: /var/lib/postgresql/data
      TZ: Asia/Jakarta
    volumes:
      - nautilus-database:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - nautilus-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nautilus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    container_name: nautilus-pgadmin
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@mail.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      TZ: Asia/Jakarta
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5051}:80"
    depends_on:
      - postgres
    networks:
      - nautilus-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    container_name: nautilus-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - nautilus-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  nautilus-network:
    driver: bridge

volumes:
  nautilus-database:
  pgadmin:
